version: "1.0"

controls:
  tool_allow_list: true
  semantic_detection: true
  composition_analysis: true
  deterministic_policy: true
  data_lineage: true
  human_approval: true
  budget_enforcement: true
  historical_attack_detection: true

tools:
  allowed:
    - external_http
    - customer_database
    - invoice_reader
    - summarizer

models:
  allowed:
    - llama3.2:3b
    - protectai/deberta-v3-base-prompt-injection-v2
  semantic_threshold: 0.90

data:
  sensitive_labels:
    - Credential
    - CustomerPII
    - DerivedFrom<CustomerPII>
    - Secret

  external_destinations:
    - EXTERNAL

budgets:
  max_tool_calls_per_session: 200
  max_external_http_calls_per_session: 20
  max_estimated_cost_per_session: 200.0
  max_agent_turns_per_session: 40
  max_input_tokens_per_session: 200000
  max_output_tokens_per_session: 100000
  max_execution_duration_ms_per_session: 600000.0
  max_model_runtime_ms_per_session: 480000.0

actions:
  sensitive_external_data: BLOCK
  unknown_tool: BLOCK
  unknown_model: BLOCK
  historical_exploit: BLOCK

historical_attack_signatures:
  - malicious_package
  - unsafe_deserialization
  - shell_injection
  - credential_exfiltration
  - model_repository_trust_remote_code

organization_ceilings:
  permanently_blocked_data_labels:
    - Credential
    - Secret

  permanently_blocked_destinations:
    - EXTERNAL

  maximum_tool_calls_per_session: 1000
  maximum_external_http_calls_per_session: 100
  maximum_estimated_cost_per_session: 1000.0
  maximum_agent_turns_per_session: 100
  maximum_input_tokens_per_session: 1000000
  maximum_output_tokens_per_session: 500000
  maximum_execution_duration_ms_per_session: 1800000.0
  maximum_model_runtime_ms_per_session: 1200000.0